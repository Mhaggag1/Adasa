<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
  @for (post of post; track post.id) {
    @if (post.category === 'بورتريه') {
      <a
        routerLink="/blogdetails"
        class="group overflow-hidden rounded-3xl border border-[#292929] bg-[#151515] transition duration-300 hover:-translate-y-1 hover:border-[#ff6200]/40"
      >
        <!-- Image -->
        <div class="relative h-64 overflow-hidden">
          <img
            [src]="post.image"
            alt="أساسيات إعدادات الكاميرا"
            class="h-full w-full object-cover transition duration-500 group-hover:scale-105"
          />

          <!-- Category -->
          <span
            class="absolute right-4 top-4 rounded-full bg-[#111]/90 px-4 py-2 text-xs font-bold text-white backdrop-blur-sm"
          >
            {{ post.category }}
          </span>
        </div>

        <!-- Card Content -->
        <div class="p-6">
          <!-- Meta -->
          <div class="mb-5 flex items-center gap-3 text-xs text-[#666]">
            <span> {{ post.readTime }}</span>

            <span> • </span>

            <span>{{ post.date }}</span>
          </div>

          <h3 class="text-xl font-bold leading-8 text-white transition group-hover:text-[#ff6200]">
            {{ post.title }}
          </h3>

          <p class="mt-4 line-clamp-2 text-sm leading-7 text-[#777]">
            {{ post.content }}
          </p>

          <div class="my-6 h-px bg-[#292929]"></div>

          <div class="flex items-center justify-between">
            <!-- Author Info -->
            <div class="flex items-center gap-3">
              <img
                [src]="post.author.avatar"
                [alt]="post.author.name"
                class="h-11 w-11 rounded-full object-cover"
              />

              <div>
                <h4 class="text-sm font-bold text-white">{{ post.author.name }}</h4>

                <p class="mt-1 text-xs text-[#666]">{{ post.author.role }}</p>
              </div>
            </div>

            <div
              class="flex h-9 w-9 items-center justify-center rounded-full border border-[#ff6200]/40 text-[#ff6200] transition duration-300 group-hover:bg-[#ff6200] group-hover:text-white"
            >
              ←
            </div>
          </div>
        </div>
      </a>
    }
  }
</div>
