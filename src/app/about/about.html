<section dir="rtl" class="relative min-h-screen overflow-hidden bg-[#080808] text-white">
  <!-- Grid Background -->
  <div
    class="absolute inset-0 opacity-40"
    style="
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 75px 75px;
    "
  ></div>

  <!-- Orange Glow -->
  <div
    class="absolute top-20 left-1/2 h-96 w-96 -translate-x-1/2 rounded-full bg-orange-500/5 blur-3xl"
  ></div>

  <!-- Content -->
  <div

    <!-- Badge -->
    <div
      class="mb-8 inline-flex items-center gap-2 rounded-full border border-orange-500/30 bg-orange-500/10 px-5 py-2 text-sm text-orange-500"
    >
      <span>●</span>
      <span>من نحن</span>
      <span>●</span>
    </div>

    <!-- Title -->
    <h1 class="max-w-4xl text-4xl font-extrabold leading-tight sm:text-5xl md:text-6xl">
      مهمتنا هي
      <span class="text-orange-500"> الإعلام والإلهام </span>
    </h1>

    <!-- Description -->
    <p class="mt-6 max-w-3xl text-base leading-8 text-gray-400 sm:text-lg">
      مدونة متخصصة في فن التصوير الفوتوغرافي. نشارك معكم أسرار المحترفين ونصائح عملية لتطوير
      مهاراتكم. نحن شغوفون بمشاركة المعرفة ومساعدة المصورين على تنمية مهاراتهم من خلال محتوى عالي
      الجودة.
    </p>

    <!-- Statistics -->
    <div class="mt-16 grid w-full grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-4">
      <!-- Card 1 -->
      <div
        class="group rounded-3xl border border-white/10 bg-[#151515] px-6 py-8 transition duration-300 hover:-translate-y-1 hover:border-orange-500/40"
      >
        <div class="mb-4 text-3xl text-orange-500 transition duration-300 group-hover:scale-110">
          <i class="fa-solid fa-users"></i>
        </div>

        <h2 class="text-3xl font-bold text-orange-500">2+ مليون</h2>

        <p class="mt-2 text-gray-500">قارئ شهرياً</p>
      </div>

      <!-- Card 2 -->
      <div
        class="group rounded-3xl border border-white/10 bg-[#151515] px-6 py-8 transition duration-300 hover:-translate-y-1 hover:border-orange-500/40"

        <div class="mb-4 text-3xl text-orange-500 transition duration-300 group-hover:scale-110">
          <i class="fa-solid fa-newspaper"></i>
        </div>

        <h2 class="text-3xl font-bold text-orange-500">500+</h2>

        <p class="mt-2 text-gray-500">مقالة منشورة</p>

      <!-- Card 3 -->
      <div

        </div>

        <h2 class="text-3xl font-bold text-orange-500">50+</h2>

        <p class="mt-2 text-gray-500">كاتب خبير</p>

      <!-- Card 4 -->

        <div class="mb-4 text-3xl text-orange-500 transition duration-300 group-hover:scale-110">

        </div>

        <h2 class="text-3xl font-bold text-orange-500">15+</h2>

        <p class="mt-2 text-gray-500">تصنيف</p>
