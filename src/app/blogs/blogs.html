<section class="min-h-screen bg-[#0A0A0A] px-6 py-20 text-white" dir="rtl">
  <div class="mx-auto max-w-7xl">
    <div
      class="relative z-10 mx-auto flex min-h-screen max-w-7xl flex-col items-center justify-center px-6 py-20 text-center"
    >
      <div
        class="mb-8 flex items-center gap-2 rounded-full border border-[#ff6200]/30 bg-[#ff6200]/10 px-5 py-2 text-sm font-medium text-white"
      >
        <span class="h-2 w-2 rounded-full bg-[#ff6200]"></span>
        <span class="h-2 w-2 rounded-full bg-[#ff6200]"></span>
        <span> مدونتنا <i class="fa-solid fa-newspaper"></i> </span>
      </div>

      <h1
        class="max-w-4xl text-5xl font-extrabold leading-[1.3] tracking-tight sm:text-6xl lg:text-7xl"
      >
        استكشف
        <span class="text-[#ff6200]"> مقالاتنا </span>
      </h1>

      <p class="mt-7 max-w-2xl text-lg leading-8 text-[#777] sm:text-xl">
        اكتشف الدروس والرؤى وأفضل الممارسات للتطوير الحديث
      </p>

      <div>
        <ul
          class="flex justify-between items-center gap-6 px-7 py-4 border border-[#80808070] rounded-4xl"
        >
          <li
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="text-gray-400 hover:text-white duration-200 py-1.5 border rounded-3xl p-0.5"
          >
            <a routerLink="allBlogs" class="p-0.5 px-1 cursor-pointer">الكل</a>
          </li>
          @for (category of category; track $index) {
            <li
              routerLinkActive="active"
              class="text-gray-400 hover:text-white duration-200 py-1.5 border rounded-3xl p-0.5"
            >
              <a routerLink="{{ category.title }}" class="p-0.5 px-1 cursor-pointer"
                >{{ category.name }} ({{ category.count }})</a
              >
            </li>
          }
        </ul>
      </div>
      <div class="flex items-center gap-2 bg-[#161616] border border-[#262626] rounded-xl p-1 mt-2">
        <button
          class="p-2 rounded-lg transition-all duration-300 bg-orange-500 text-white cursor-pointer"
          (click)="view = 'grid'"
        >
          <i class="fa-solid fa-grid-horizontal w-5 h-5"></i>
        </button>
        <button
          class="p-2 rounded-lg transition-all duration-300 bg-orange-500 text-white cursor-pointer"
          (click)="view = 'list'"
        >
          <i class="fa-solid fa-bars w-5 h-5"></i>
        </button>
      </div>
      <div class="mt-5">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
  <app-suggested></app-suggested>
</section>
